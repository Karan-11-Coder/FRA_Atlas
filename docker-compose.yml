# FRA Atlas: one command to run everything.
#   cp .env.example .env    (then set JWT_SECRET; see README)
#   docker compose up --build
# Frontend http://localhost:3000, backend http://localhost:8000 (API docs at /docs).
# All configuration comes from .env; nothing secret is baked into the images.

services:
  backend:
    build:
      context: .
      dockerfile: fra-atlas/backend/Dockerfile
    env_file: .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SEED_DEMO: ${SEED_DEMO:-1}
    ports:
      - "8000:8000"
    volumes:
      - fra_data:/data              # SQLite database
      - fra_uploads:/app/uploads    # uploaded claim documents (may contain PII)
    restart: unless-stopped

  frontend:
    build:
      context: fra-atlas/UI_FRA
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fra_data:
  fra_uploads:
